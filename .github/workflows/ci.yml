name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.14", "3.15" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --extra figures --extra benchmark

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (types)
        run: uv run mypy src/daf_jev

      - name: Unit tests + coverage gate (>= 90%)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-results
          uv run pytest tests/unit --cov=src --junitxml=ci-results/unit.xml 2>&1 | tee ci-results/unit.log
      - name: Retain unit test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: unit-python-${{ matrix.python-version }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Live tests (2 tests skip without JEV_API_KEY)
        run: uv run pytest tests/live

      - name: Docs snapshot drift check
        run: uv run daf-jev docs-verify

      - name: Offline scraper drift check
        run: uv run python scripts/scrape_docs.py --check --manifest docs/reference/MANIFEST.json
      - name: Serve subcommand smoke (stdio only)
        run: uv run daf-jev serve --help

      - name: Keyless example smoke
        run: uv run python examples/quickstart.py
      - name: Keyless provider-dispatch example smoke (SKIP + exit 0, no network even with a key)
        run: uv run python examples/providers_example.py
