name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --extra dev --extra figures --extra benchmark

      - name: Run the offline package gate
        env:
          DAF_JEV_JUNIT_XML: ci-results/unit.xml
          UV_NO_SYNC: "1"
          UV_OFFLINE: "1"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-results
          bash scripts/gate.sh 2>&1 | tee ci-results/gate.log

      - name: Retain offline gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: unit-python-${{ matrix.python-version }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Check live test collection
        run: uv run --locked --no-sync python -m pytest --collect-only tests/live

      - name: Serve subcommand smoke (stdio only)
        run: uv run --locked --no-sync daf-jev serve --help

      - name: Check example command startup
        run: |
          uv run --locked --no-sync python examples/quickstart.py --help
          uv run --locked --no-sync python examples/providers_example.py --help
