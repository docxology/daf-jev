name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --extra figures

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (types)
        run: uv run mypy src/daf_jev

      - name: Unit tests + coverage gate (>= 90%)
        run: uv run pytest tests/unit --cov=src

      - name: Docs snapshot drift check
        run: uv run daf-jev docs-verify

      - name: Offline scraper drift check
        run: uv run python scripts/scrape_docs.py --check --manifest docs/reference/MANIFEST.json

      - name: Keyless example smoke
        run: uv run python examples/quickstart.py
