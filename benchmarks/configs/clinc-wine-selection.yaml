# Published CLINC validation and grouped Wine validation; official/outer test omitted.
# Set the five thread-limit environment variables before starting Python (see docs/full_study.md).
format: dafjev.benchmark-run/1
seed: 20261007
budget_usd: '0'
sampling: all
capability_probes: true
graphical_experiments: false
execution_selection:
  phase: quality
timeout_s: 60
local_time_limit_s: 7200
backends:
- id: prior
  kind: prior
  hosted: false
- id: tfidf-logistic-C1
  kind: sklearn_text
  hosted: false
  datasets:
  - clinc150
- id: wine-hist-gradient-boosting
  kind: sklearn_structured
  hosted: false
  datasets:
  - wine
datasets:
- id: clinc150-selection
  path: ../../.benchmarks/full-study-inputs/clinc150-selection.json
- id: wine-selection
  path: ../../.benchmarks/full-study-inputs/wine-selection.json
