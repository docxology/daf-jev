# Fixed offline references; one CPU profile at a time. No validation gates after final fitting.
format: dafjev.benchmark-run/1
seed: 20261007
budget_usd: '0'
sampling: all
capability_probes: false
graphical_experiments: false
execution_selection:
  phase: quality
timeout_s: 60
local_time_limit_s: 7200
backends:
- id: prior-full
  kind: prior
  hosted: false
- id: tfidf-logistic-C1-full
  kind: sklearn_text
  hosted: false
  datasets:
  - banking77
  - clinc150
- id: wine-hist-gradient-boosting-full
  kind: sklearn_structured
  hosted: false
  datasets:
  - wine
datasets:
- id: banking77-final-train
  path: ../../.benchmarks/full-study-inputs/banking77-final-train.json
- id: clinc150-final-train
  path: ../../.benchmarks/full-study-inputs/clinc150-final-train.json
- id: wine-final-train
  path: ../../.benchmarks/full-study-inputs/wine-final-train.json
