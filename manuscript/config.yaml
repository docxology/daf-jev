# daf-jev Manuscript Configuration
# Public release (docxology/daf-jev v0.3.0), archived on Zenodo.
# Loaded by `yaml.safe_load` in the rendering infrastructure (paper metadata) and by
# `src/daf_jev/manuscript_variables.py::generate_variables` (CONFIG_* tokens, experiment parameters).

# Consumed by: `infrastructure/rendering/pdf_renderer.py` and the pipeline report model.
paper:
  # RASP Standard: title must be descriptive and objective.
  title: "Jev in Practice: A Composable Python Toolkit for TypeSafe's System One Decision Model"
  subtitle: "Batching Speedups, Confidence-Gated Routing, and Calibrated Decisions over a Single HTTP Endpoint"
  version: "0.3.0"
  date: "" # Auto-generated by the validation infrastructure when empty.
  cover:
    image: "../output/figures/graphical_abstract.png"
    alt: "Graphical abstract, three zones read left to right: the decision state with the noul, choice, and score question primitives; the daf-jev layer stack from typed client through compose gates and routing to the evaluator and calibration, consumed via CLI, MCP server, and agent skill; and a live outputs panel with batching speedups, pipeline latency, and calibration reliability read from the benchmark JSON payloads."

# Consumed by: `infrastructure.publishing.metadata_from_config` (author records,
# DOI of record, repository URL) and the Zenodo publication pipeline.
publication:
  # Concept DOI of record: identifies all versions of this deposit.
  doi: "10.5281/zenodo.22816187"
  # Landing page of the versioned record this edition corresponds to.
  version_record: "https://zenodo.org/records/22816188/latest"
  # Source repository (GitHub owner/repo slug and canonical URL).
  github_repository: "docxology/daf-jev"
  repository_url: "https://github.com/docxology/daf-jev"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

keywords:
  - "decision models"
  - "LLM APIs"
  - "calibrated confidence"
  - "batching"
  - "confidence-gated routing"
  - "Python client"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"

# Steganography profile — disabled for this release.
steganography:
  enabled: false

# Render format toggles — PDF only.
render:
  formats:
    pdf: true
    html: false
    slides: false
    docx: false
    epub: false

# ZERO-MOCK TOLERANCE: any failure blocks manuscript rendering.
testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Experimental parameters — read by manuscript_variables.py and the figure generators.
# Mirrors the defaults documented in benchmarks/README.md and benchmarks/bench_batching.py.
experiment:
  batching_n_values: [5, 10, 20] # batch widths compared by benchmarks/bench_batching.py
  patterns_runs: 10 # default --runs for benchmarks/bench_patterns.py
  model: "jev-latest" # default --model for both benchmark scripts
