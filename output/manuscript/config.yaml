# daf-jev Manuscript Configuration
# Private sidecar project (docxology projects) — no DOI/Zenodo/ORCID deposition.
# Loaded by `yaml.safe_load` in the rendering infrastructure (paper metadata) and by
# `src/daf_jev/manuscript_variables.py::generate_variables` (CONFIG_* tokens, experiment parameters).

# Consumed by: `infrastructure/rendering/pdf_renderer.py` and the pipeline report model.
paper:
  # RASP Standard: title must be descriptive and objective.
  title: "Jev in Practice: A Composable Python Toolkit for TypeSafe's System One Decision Model"
  subtitle: "Batching Speedups, Confidence-Gated Routing, and Calibrated Decisions over a Single HTTP Endpoint"
  version: "0.2.0"
  date: "" # Auto-generated by the validation infrastructure when empty.

# Consumed by: `infrastructure.publishing.extract_publication_metadata`.
# Private sidecar project: no orcid / doi / Zenodo fields.
authors:
  - name: "docxology"
    affiliation: "docxology projects (private)"
    corresponding: true

keywords:
  - "decision models"
  - "LLM APIs"
  - "calibrated confidence"
  - "batching"
  - "confidence-gated routing"
  - "Python client"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"

# Steganography profile — disabled for this private sidecar project.
steganography:
  enabled: false

# Render format toggles — PDF only for this sidecar project.
render:
  formats:
    pdf: true
    html: false
    slides: false
    docx: false
    epub: false

# ZERO-MOCK TOLERANCE: any failure blocks manuscript rendering.
testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Experimental parameters — read by manuscript_variables.py and the figure generators.
# Mirrors the defaults documented in benchmarks/README.md and benchmarks/bench_batching.py.
experiment:
  batching_n_values: [5, 10, 20] # batch widths compared by benchmarks/bench_batching.py
  patterns_runs: 10 # default --runs for benchmarks/bench_patterns.py
  model: "jev-latest" # default --model for both benchmark scripts
