[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "daf-jev"
version = "0.7.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Typed decision interfaces, modular orchestration, and reproducible local and hosted model evaluation"
readme = "README.md"
keywords = ["decision-models", "benchmarking", "typed-interfaces", "reproducibility", "bayesian-inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    {name = "Daniel Ari Friedman"},
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/docxology/daf-jev"
Documentation = "https://github.com/docxology/daf-jev/tree/main/docs"
Repository = "https://github.com/docxology/daf-jev"
Issues = "https://github.com/docxology/daf-jev/issues"
Changelog = "https://github.com/docxology/daf-jev/releases"
Archive = "https://doi.org/10.5281/zenodo.22816187"

[tool.setuptools.packages.find]
where = ["src"]
include = ["daf_jev*"]
namespaces = false

[tool.setuptools.package-data]
daf_jev = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "matplotlib>=3.7",
    "pypdf>=6,<7",
    "mcp>=1.2,<2",
    "mypy>=1.19",
    "types-PyYAML>=6.0",
    "ruff>=0.16.8",
]
figures = [
    "matplotlib>=3.7",
    "pillow>=10,<13",
]
mcp = [
    "mcp>=1.2,<2",
]
benchmark = [
    "scikit-learn>=1.5,<2",
    "psutil>=6,<8",
]

[project.scripts]
daf-jev = "daf_jev.cli:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: subprocess and full-pipeline integration checks kept for release profiles",
    "live: requires JEV_API_KEY and network access; skipped when the key is absent",
]
timeout = 120

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# >=90% on src/ is the enforced gate (template_code_project convention).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
exclude_also = [
    '^\s*\.\.\.\s*$',  # protocol method stubs (never executed)
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (line-length not enforced)
    "F",               # pyflakes
    "I",               # isort
    "B",               # flake8-bugbear
    "UP",              # pyupgrade
    "SIM",             # flake8-simplify
    "RUF",             # ruff-specific
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "matplotlib", "matplotlib.*", "cycler", "cycler.*", "kiwisolver", "kiwisolver.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["tomllib", "tomli"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "psutil", "psutil.*"]
ignore_missing_imports = true
follow_imports = "skip"
