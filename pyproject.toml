[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daf-jev"
version = "0.6.0"
license = {text = "MIT"}
description = "Modular, composable Python client and decision toolkit for the TypeSafe Jev (System One) API"
authors = [
    {name = "Daniel Ari Friedman"},
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "matplotlib>=3.7",
    "mcp>=1.2,<2",
    "mypy>=1.19",
    "types-PyYAML>=6.0",
    "ruff>=0.16.8",
]
figures = [
    "matplotlib>=3.7",
]
mcp = [
    "mcp>=1.2,<2",
]

[project.scripts]
daf-jev = "daf_jev.cli:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: subprocess and full-pipeline integration checks kept for release profiles",
    "live: requires JEV_API_KEY and network access; skipped when the key is absent",
]
timeout = 120

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# >=90% on src/ is the enforced gate (template_code_project convention).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
exclude_also = [
    '^\s*\.\.\.\s*$',  # protocol method stubs (never executed)
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (line-length not enforced)
    "F",               # pyflakes
    "I",               # isort
    "B",               # flake8-bugbear
    "UP",              # pyupgrade
    "SIM",             # flake8-simplify
    "RUF",             # ruff-specific
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "matplotlib", "matplotlib.*", "cycler", "cycler.*", "kiwisolver", "kiwisolver.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["tomllib", "tomli"]
ignore_missing_imports = true

